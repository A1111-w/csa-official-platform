name: CSA CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: csa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Maven tests
        working-directory: csa-official-backend
        run: |
          chmod +x mvnw
          ./mvnw test

  backend-containers:
    name: MySQL Redis Flyway integration
    runs-on: ubuntu-latest
    needs: backend-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Testcontainers integration test
        working-directory: csa-official-backend
        run: |
          chmod +x mvnw
          ./mvnw -Dit.containers=true test

  frontend:
    name: Frontend lint build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: csa-official-frontend/package-lock.json
      - name: Install dependencies
        working-directory: csa-official-frontend
        run: npm ci
      - name: Lint
        working-directory: csa-official-frontend
        run: npm run lint
      - name: Build
        working-directory: csa-official-frontend
        run: npm run build
      - name: Unit tests
        working-directory: csa-official-frontend
        run: npm run test
      - name: Audit production dependencies
        working-directory: csa-official-frontend
        run: npm audit --omit=dev --audit-level=high

  configuration:
    name: Compose and production fail-fast checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required variables fail fast
        shell: bash
        run: |
          if docker compose -f compose.production.yml config >/dev/null 2>&1; then
            echo "compose unexpectedly accepted missing production variables"
            exit 1
          fi
      - name: Production compose resolves with temporary CI-only values
        shell: bash
        run: |
          env \
            MYSQL_ROOT_PASSWORD=ci-only-root-password \
            MYSQL_APP_PASSWORD=ci-only-app-password \
            REDIS_PASSWORD=ci-only-redis-password \
            JWT_SECRET=ci-only-jwt-secret-with-at-least-32-characters \
            MAIL_USERNAME=mail@localhost.invalid \
            MAIL_PASSWORD=ci-only-mail-credential \
            PUBLIC_ORIGIN=https://csa.example.invalid \
            SITE_ADDRESS=csa.example.invalid \
            docker compose -f compose.production.yml config > "$RUNNER_TEMP/compose.production.yml"
          grep -q "internal: true" "$RUNNER_TEMP/compose.production.yml"
          grep -q "AUTH_COOKIE_SECURE: \"true\"" "$RUNNER_TEMP/compose.production.yml"
          rm -f "$RUNNER_TEMP/compose.production.yml"

  dependency-and-config-scan:
    name: Dependency and configuration scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Review changed dependencies on pull requests
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  docker:
    name: Docker build and image scan
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend, configuration]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag csa-backend:ci ./csa-official-backend
      - name: Build frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=/ --tag csa-frontend:ci ./csa-official-frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: csa-backend:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: csa-frontend:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: Critical Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: csa_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: csa-official-frontend/package-lock.json
      - name: Generate ephemeral E2E values
        shell: bash
        run: |
          password="$(openssl rand -hex 16)"
          jwt="$(openssl rand -hex 32)"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "E2E_JWT_SECRET=$jwt" >> "$GITHUB_ENV"
          echo "::add-mask::$password"
          echo "::add-mask::$jwt"
      - name: Start backend with dev-only seed
        working-directory: csa-official-backend
        shell: bash
        run: |
          chmod +x mvnw
          mkdir -p "$RUNNER_TEMP/csa-e2e-uploads"
          nohup env \
            SPRING_PROFILES_ACTIVE=dev \
            SERVER_PORT=8080 \
            DB_URL='jdbc:mysql://127.0.0.1:3306/csa_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true' \
            DB_USERNAME=root \
            DB_PASSWORD=ci-only-root-password \
            CSA_CACHE_TYPE=redis \
            REDIS_HOST=127.0.0.1 \
            REDIS_PORT=6379 \
            REDIS_SSL=false \
            JWT_SECRET="$E2E_JWT_SECRET" \
            DEMO_SEED_ENABLED=true \
            DEMO_SEED_LOCATION="file:$GITHUB_WORKSPACE/db/seed.sql" \
            DEMO_SEED_PASSWORD="$E2E_PASSWORD" \
            UPLOAD_PATH="$RUNNER_TEMP/csa-e2e-uploads/" \
            AUTH_COOKIE_SECURE=false \
            CORS_ALLOWED_ORIGIN_PATTERNS=http://127.0.0.1:3000 \
            MAIL_USERNAME=mail@localhost.invalid \
            ./mvnw spring-boot:run > "$RUNNER_TEMP/csa-backend.log" 2>&1 &
      - name: Wait for backend readiness
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/csa-backend.log"
          exit 1
      - name: Install frontend dependencies and browser
        working-directory: csa-official-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run critical browser workflows
        working-directory: csa-official-frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8080
          E2E_API_BASE_URL: http://127.0.0.1:8080
          E2E_USERNAME: member
        run: npm run test:e2e
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: csa-e2e-artifacts
          path: |
            csa-official-frontend/test-results
            csa-official-frontend/playwright-report
            ${{ runner.temp }}/csa-backend.log
